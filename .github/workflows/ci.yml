name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify Python version
      run: python --version

    - name: Check Python syntax with AST parse
      run: |
        python -c "import ast, pathlib, sys; errors = []; [errors.append(str(f)) for f in pathlib.Path('scripts').glob('*.py') if not (lambda: (ast.parse(f.read_text()), True)[1])()]; sys.exit(len(errors))"

    - name: Validate YAML files
      run: |
        python -c "import yaml, pathlib; [yaml.safe_load(f.read_text()) for f in pathlib.Path('.github').glob('**/*.yml')]"

    - name: Check requirements.txt
      run: |
        cat requirements.txt

    - name: List scripts
      run: |
        python -c "import pathlib; [print(f) for f in pathlib.Path('scripts').glob('*.py')]"

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Check for common issues
      run: |
        python -c "import ast, pathlib; print('Checking Python files...'); files = list(pathlib.Path('scripts').glob('*.py')); print('Found ' + str(len(files)) + ' Python files')"

    - name: Verify file encoding
      run: |
        python -c "import pathlib; [pathlib.Path(f).read_text(encoding='utf-8') for f in pathlib.Path('.').glob('**/*.py')]"
