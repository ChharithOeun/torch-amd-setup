name: Update Changelog

on:
  push:
    branches: [ main ]

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Check if changelog needs update
      run: |
        python -c "import pathlib; print('CHANGELOG.md exists:', pathlib.Path('CHANGELOG.md').exists())"

    - name: Update CHANGELOG on commit
      if: github.event_name == 'push'
      run: |
        python -c "
import pathlib
changelog = pathlib.Path('CHANGELOG.md')
print('Changelog last modified:', changelog.stat().st_mtime if changelog.exists() else 'N/A')
"

    - name: Commit changelog update (if needed)
      if: github.event_name == 'push'
      run: |
        git config user.name 'Changelog Bot'
        git config user.email 'bot@github.com'
        echo 'Changelog workflow configured'
